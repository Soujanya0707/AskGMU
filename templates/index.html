<!DOCTYPE html>
<html>
<head>
<title>AskGMU Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
  <h2>AskGMU Chatbot</h2>
  <p class="tagline">Ask about admissions, exams, and notices</p>
  <div id="chatbox"></div>
  <div class="input-row">
    <input id="userInput" placeholder="Type your question...">
    <button onclick="sendMessage()">Send</button>
    <button class="refresh" onclick="refreshData()">Refresh Data</button>
  </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
